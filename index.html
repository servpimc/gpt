<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA quoi maintenan</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="./assets/script.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

    <div id="auth-bar">
        <div id="google-btn"></div>
    </div>
    <div id="overlay"></div>

    <div id="chat-container">
        <div id="msg-agent-0" class="message agent">Bienvenue ! Connectez-vous avec Google pour démarrer une conversation.</div>
    </div>

    <div id="input-container">
        <input disabled="true" type="text" id="user-input" placeholder="Écris ton message ici..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button disabled="true" onclick="sendMessage()">Envoyer</button>
    </div>

</body>
</html>
