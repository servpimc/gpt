<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA quoi maintenant</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="./assets/script.js"></script>
    <script defer src="./assets/historique.js"></script>
    <script defer src="./assets/msg.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <dialog id="google">
        <h2 id="google-h2">Connectez-vous à Google</h2>
        <div id="google-btn"></div>
    </dialog>

    <div id="entete">
        <h2 id="title-chat">Nouvelle discution</h2>
        <button id="name" value="edit" onclick="rename(document.getElementById('name').value)">✏️</button>
    </div>

    <nav id="sidebar">
        <button id="toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <button id="new-chat" onclick="newChat()">NEW</button>
        <div id="select-cat">
            <button class='selected' id='ia' style="width:45%" onclick="afficheHistorique(); document.getElementById('ia').classList.add('selected'); document.getElementById('user').classList.remove('selected')">IA</button>
            <button id='user' style="width:55%" onclick="listerChatUser()">User</button>
        </div>
        <ul id="container-chanel">
        </ul>
    </nav>
    <div id="content">
        
        <div class="card" id="chat-container">
            <div id="msg-agent-0" class="message agent">Bienvenue ! Connectez-vous avec Google pour démarrer une conversation.</div>
        </div>
        
        <div class="card" id="input-container">
            <input type="text" id="user-input" placeholder="Écris ton message ici..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <select name="model" id="model-select">
                <option value="llama">llama</option>
                <option value="open">open</option>
            </select>
            <button onclick="sendIa()" id="send">⌲</button>
        </div>
        
    </div>
    
</body>
</html>
